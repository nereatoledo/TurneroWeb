<div class="login-wrapper">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4" style="color: #8923dc;">Turnero Web</h3>

                        <ul class="nav nav-pills nav-justified mb-4">
                            <li class="nav-item">
                                <a class="nav-link" [class.active]="roleSelected === 'PACIENTE'" (click)="roleSelected = 'PACIENTE'" style="cursor:pointer; color: #8923dc;" [style.backgroundColor]="roleSelected === 'PACIENTE' ? '#8923dc' : 'transparent'" [style.color]="roleSelected === 'PACIENTE' ? 'white' : '#8923dc'">Paciente</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" [class.active]="roleSelected === 'ADMIN'" (click)="roleSelected = 'ADMIN'" style="cursor:pointer; color: #8923dc;" [style.backgroundColor]="roleSelected === 'ADMIN' ? '#8923dc' : 'transparent'" [style.color]="roleSelected === 'ADMIN' ? 'white' : '#8923dc'">Administrador</a>
                            </li>
                        </ul>

                        <div *ngIf="errorMessage" class="alert alert-danger text-center">
                            {{ errorMessage }}
                        </div>

                        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
                            <div class="mb-4">
                                <label for="username" class="form-label fw-bold">Nombre de Usuario</label>
                                <input type="text" class="form-control form-control-lg" id="username"
                                    [(ngModel)]="username" name="username" required placeholder="Ej: jperez"
                                    autocomplete="off" autofocus>
                            </div>

                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary btn-lg"
                                    [disabled]="!username || username.trim() === ''"
                                    style="background-color: #8923dc; border: none;">
                                    {{ roleSelected === 'PACIENTE' ? 'Ingresar a mis Turnos' : 'Ingresar al Panel' }}
                                </button>
                            </div>
                        </form>

                        <div class="text-center mb-4" *ngIf="roleSelected === 'PACIENTE'">
                            <p class="mb-1 small text-muted">¿No tenés una cuenta de paciente?</p>
                            <a routerLink="/registro" class="btn btn-outline-primary w-100"
                                style="color: #8923dc; border-color: #8923dc;">
                                <i class="fa fa-user-plus"></i> Registrarse como Paciente
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
